<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeuroIrk — умный помощник</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c3e50, #4a6491);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            transition: background 0.3s ease;
        }

        body.dark {
            background: linear-gradient(135deg, #1a2634, #2d3b4f);
        }

        .app-container {
            display: flex;
            height: 100%;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.92);
            position: relative;
            transition: background-color 0.3s ease;
        }

        .dark .app-container {
            background-color: rgba(30, 30, 35, 0.95);
        }

        /* ===== БОКОВАЯ ПАНЕЛЬ ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 85%;
            max-width: 320px;
            background: #ffffff;
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s ease, background-color 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.15);
        }

        .dark .sidebar {
            background: #1e1e24;
            border-right: 1px solid #2a2a32;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
            backdrop-filter: blur(2px);
        }

        .overlay.active {
            display: block;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.3s ease;
        }

        .dark .sidebar-header {
            border-bottom: 1px solid #2a2a32;
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 600;
            color: #1e1e24;
            transition: color 0.3s ease;
        }

        .dark .sidebar-title {
            color: #f0f0f4;
        }

        .sidebar-menu-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            color: #1e293b;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            transition: background 0.2s, color 0.3s ease, border-color 0.3s ease;
        }

        .dark .sidebar-menu-btn {
            background: #2a2a32;
            border: 1px solid #3a3a4a;
            color: #f0f0f4;
        }

        .sidebar-menu-btn:active {
            background: #e2e8f0;
        }

        .dark .sidebar-menu-btn:active {
            background: #3a3a4a;
        }

        .ds-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
        }

        .new-chat-button {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin: 12px 16px;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            color: #1e293b;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s, color 0.3s ease, border-color 0.3s ease;
        }

        .dark .new-chat-button {
            background: #2a2a32;
            border: 1px solid #3a3a4a;
            color: #f0f0f4;
        }

        .new-chat-button:active {
            background: #e2e8f0;
        }

        .dark .new-chat-button:active {
            background: #3a3a4a;
        }

        .settings-section {
            padding: 16px;
            border-bottom: 1px solid #eaeaea;
            transition: border-color 0.3s ease;
        }

        .dark .settings-section {
            border-bottom: 1px solid #2a2a32;
        }

        .settings-title {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 12px;
            transition: color 0.3s ease;
        }

        .dark .settings-title {
            color: #9ca3af;
        }

        .theme-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .theme-btn {
            flex: 1;
            padding: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 13px;
            color: #1e293b;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s, color 0.3s ease, border-color 0.3s ease;
        }

        .dark .theme-btn {
            background: #2a2a32;
            border: 1px solid #3a3a4a;
            color: #f0f0f4;
        }

        .theme-btn.active {
            background: #0f172a;
            color: white;
            border-color: #0f172a;
        }

        .dark .theme-btn.active {
            background: #3a3a4a;
            border-color: #4a4a5a;
        }

        .language-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .lang-btn {
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            color: #1e293b;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s, color 0.3s ease, border-color 0.3s ease;
        }

        .dark .lang-btn {
            background: #2a2a32;
            border: 1px solid #3a3a4a;
            color: #f0f0f4;
        }

        .lang-btn.active {
            background: #0f172a;
            color: white;
            border-color: #0f172a;
        }

        .dark .lang-btn.active {
            background: #3a3a4a;
            border-color: #4a4a5a;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px;
        }

        .history-item {
            padding: 12px;
            margin-bottom: 6px;
            background: #f8fafc;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 14px;
            color: #1e293b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s, color 0.3s ease;
        }

        .dark .history-item {
            background: #2a2a32;
            color: #f0f0f4;
        }

        .history-item:active {
            background: #e2e8f0;
        }

        .dark .history-item:active {
            background: #3a3a4a;
        }

        .history-date {
            font-size: 11px;
            color: #64748b;
            margin-left: 8px;
            white-space: nowrap;
            transition: color 0.3s ease;
        }

        .dark .history-date {
            color: #9ca3af;
        }

        .delete-btn {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .delete-btn:active {
            background: rgba(0,0,0,0.1);
            color: #dc2626;
        }

        .dark .delete-btn:active {
            background: rgba(255,255,255,0.1);
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .main-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            transition: border-color 0.3s ease;
        }

        .dark .main-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .main-title {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-left: 12px;
            transition: color 0.3s ease;
        }

        .dark .main-title {
            color: #f0f0f4;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            padding: 8px 0;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 500;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }

        .user-avatar {
            background: #0f172a;
            color: white;
        }

        .dark .user-avatar {
            background: #3a3a4a;
        }

        .bot-avatar {
            background: #334155;
            color: white;
        }

        .dark .bot-avatar {
            background: #4a4a5a;
        }

        .message-content {
            flex: 1;
        }

        .message-text {
            font-size: 15px;
            line-height: 1.5;
            color: #1e293b;
            white-space: pre-wrap;
            word-break: break-word;
            transition: color 0.3s ease;
        }

        .dark .message-text {
            color: #f0f0f4;
        }

        .input-container {
            padding: 14px 16px 24px 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            transition: border-color 0.3s ease;
            background: inherit;
        }

        .dark .input-container {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .input-area {
            flex: 1;
            padding: 14px 18px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 28px;
            font-size: 16px;
            line-height: 1.4;
            color: #1e293b;
            resize: none;
            min-height: 54px;
            max-height: 120px;
            outline: none;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            font-family: inherit;
        }

        .dark .input-area {
            background: #2a2a32;
            border: 1px solid #3a3a4a;
            color: #f0f0f4;
        }

        .input-area:focus {
            border-color: #0f172a;
        }

        .send-button {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
            cursor: pointer;
            transition: background 0.2s, color 0.3s ease, border-color 0.3s ease;
        }

        .dark .send-button {
            background: #2a2a32;
            color: #f0f0f4;
            border: 1px solid #3a3a4a;
        }

        .send-button:active {
            background: #f1f5f9;
        }

        .dark .send-button:active {
            background: #3a3a4a;
        }

        .send-button.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 7px;
            height: 7px;
            background: #64748b;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
            transition: background 0.3s ease;
        }

        .dark .loading-dots span {
            background: #9ca3af;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%,80%,100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        .footer {
            text-align: center;
            padding: 6px 16px 10px;
            font-size: 10px;
            color: #64748b;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .dark .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #9ca3af;
        }

        .delete-confirm {
            position: fixed;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 16px;
            z-index: 2000;
            width: 200px;
            border: 1px solid #eaeaea;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .dark .delete-confirm {
            background: #2a2a32;
            border-color: #3a3a4a;
            color: #f0f0f4;
        }

        .delete-confirm p {
            margin-bottom: 16px;
            font-size: 15px;
            font-weight: 500;
        }

        .delete-confirm-buttons {
            display: flex;
            gap: 10px;
        }

        .delete-confirm-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .delete-confirm-yes {
            background: #dc2626;
            color: white;
        }

        .delete-confirm-no {
            background: #f1f5f9;
            color: #1e293b;
        }

        .dark .delete-confirm-no {
            background: #3a3a4a;
            color: #f0f0f4;
        }
    </style>
</head>

        <div class="overlay" id="overlay"></div>

        <!-- Боковая панель -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">NeuroIrk</div>
                <div class="sidebar-menu-btn" id="closeSidebarBtn">
                    <div class="ds-icon">

                    </div>
                </div>
            </div>
            
            <div class="new-chat-button" id="newChatBtnSidebar">
                <div class="ds-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">

                </div>
                <span>Новый чат</span>
            </div>

            <div class="settings-section">
                <div class="settings-title">Тема</div>
                <div class="theme-buttons">
                    <button class="theme-btn active" data-theme="light">Светлая</button>
                    <button class="theme-btn" data-theme="dark">Тёмная</button>
                </div>
                <div class="settings-title">Язык</div>
                <div class="language-buttons">
                    <button class="lang-btn active" data-lang="ru">Русский</button>
                    <button class="lang-btn" data-lang="en">English</button>
                    <button class="lang-btn" data-lang="zh">中文</button>
                </div>
            </div>
            
            <div class="chat-history" id="chatHistory"></div>
        </div>

        <!-- Основной экран -->
        <div class="main-content">
            <div class="main-header">
                <div class="sidebar-menu-btn" id="openMenuBtn">

                    ru: ["Отвечаю на вопросы об Иркутске: история, достопримечательности, школы, транспорт. Спрашивайте!", "Ищу в своей базе знаний самую полезную информацию об Иркутске для вас.", "Готовлю для вас интересные факты о городе. Что бы вы хотели узнать?", "Анализирую базу знаний и готовлю ответ. Спрашивайте!"],
                    en: ["Answering questions about Irkutsk: history, sights, schools, transport. Ask away!", "Searching my knowledge base for the most useful information about Irkutsk for you.", "Preparing interesting facts about the city for you. What would you like to know?", "Analyzing the knowledge base and preparing an answer. Ask away!"],
                    zh: ["回答关于伊尔库茨克的问题：历史、景点、学校、交通。请问吧！", "在我的知识库中为您查找关于伊尔库茨克最有用的信息。", "为您准备关于这座城市的趣闻。您想了解什么？", "分析知识库并准备答案。请问吧！"]
                },
                thanks: {
                    ru: ["Пожалуйста! Рад был помочь. Обращайтесь ещё!", "Всегда к вашим услугам! Спрашивайте, если что-то ещё интересует.", "Спасибо за вопрос! Буду ждать новых.", "Обращайтесь! Всегда рад помочь."],
                    en: ["You're welcome! Glad to help. Ask anytime!", "Always at your service! Let me know if you have more questions.", "Thank you for asking! Looking forward to more.", "Feel free to ask! Always happy to help."],
                    zh: ["不客气！很高兴能帮上忙。随时再问！", "随时为您服务！如果还有其他问题，请告诉我。", "谢谢您的提问！期待更多问题。", "请问吧！总是乐意帮忙。"]
                },
                goodbye: {
                    ru: ["До свидания! Буду рад снова помочь вам с вопросами об Иркутске.", "Всего доброго! Если захотите узнать ещё что-то о городе, я здесь.", "Пока! Надеюсь, информация была полезной.", "До встречи! Жду новых вопросов."],
                    en: ["Goodbye! I'll be happy to help you again with questions about Irkutsk.", "All the best! If you want to know more about the city, I'm here.", "Bye! Hope the information was useful.", "See you! Looking forward to more questions."],
                    zh: ["再见！我很乐意再次帮助您解答关于伊尔库茨克的问题。", "祝一切顺利！如果您想了解更多关于这座城市的信息，我随时在。", "再见！希望这些信息对您有用。", "再见！期待更多问题。"]
                }
            };
            const arr = responses[type][currentLanguage];
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getLocalAnswer(question) {
            const q = question.toLowerCase().trim();
            const kb = getCurrentKnowledgeBase();
            const isGeneralIrkutsk = (q === "иркутск" || q === "irkutsk" || q === "и" + "ркутск" || q === "об иркутске" || q === "про иркутск");
            
            for (let key in kb) {
                if (typeof kb[key] === 'string') {
                    if (key === "иркутск" && !isGeneralIrkutsk) continue;
                    if (q.includes(key.toLowerCase())) {
                        return kb[key];
                    }
                }
            }
            return null;
        }

        function handleSpecialPhrase(question) {
            const q = question.toLowerCase().trim();
            if (q.includes('привет') || q.includes('здравствуй') || q.includes('здравствуйте') || 
                q.includes('hello') || q.includes('hi') || q.includes('hey') || q.includes('你好')) {
                return getRandomResponse('greeting');
            }
            if (q.includes('как дела') || q.includes('как жизнь') || q.includes('how are you') || q.includes('how are u') || q.includes('怎么样')) {
                return getRandomResponse('howAreYou');
            }
            if (q.includes('что делаешь') || q.includes('чем занят') || q.includes('what are you doing') || q.includes('what do you do') || q.includes('在做什么')) {
                return getRandomResponse('whatDoing');
            }
            if (q.includes('спасибо') || q.includes('thanks') || q.includes('thank you') || q.includes('谢谢')) {
                return getRandomResponse('thanks');
            }
            if (q.includes('пока') || q.includes('до свидания') || q.includes('goodbye') || q.includes('bye') || q.includes('再见')) {
                return getRandomResponse('goodbye');
            }
            return null;
        }

        async function getAnswer(question) {
            const special = handleSpecialPhrase(question);
            if (special) return special;
            const localAnswer = getLocalAnswer(question);
            if (localAnswer) return localAnswer;
            const unknown = {
                ru: "Извините, я не знаю ответа на этот вопрос. Я могу рассказать только об Иркутске: история, достопримечательности, школы, улицы. Попробуйте спросить что-то конкретное.",
                en: "Sorry, I don't know the answer. I can only tell about Irkutsk: history, sights, schools, streets. Try to ask something specific.",
                zh: "对不起，我不知道这个问题的答案。我只能告诉你关于伊尔库茨克的信息：历史、景点、学校、街道。请询问一些具体问题。"
            };
            return unknown[currentLanguage];
        }

        function formatDate(date) {
            const d = new Date(date);
            const now = new Date();
            const diff = now - d;
            const days = Math.floor(diff / (1000*60*60*24));
            if (days === 0) return texts[currentLanguage].today;
            if (days === 1) return texts[currentLanguage].yesterday;
            if (days < 7) return `${days} ${texts[currentLanguage].daysAgo}`;
            return d.toLocaleDateString(currentLanguage);
        }

        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.classList.toggle('dark', theme === 'dark');
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.theme-btn[data-theme="${theme}"]`).classList.add('active');
            localStorage.setItem('neuroirk_theme', theme);
        }

        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[data-lang="${lang}"]`).classList.add('active');
            document.getElementById('userInput').placeholder = texts[lang].placeholder;
            document.querySelector('#newChatBtnSidebar span').textContent = texts[lang].newChat;
            localStorage.setItem('neuroirk_language', lang);
            const container = document.getElementById('chatContainer');
            if (container.children.length === 1) {
                container.innerHTML = '';
                addMessage(texts[lang].welcome, false);
            }
        }

        function updateHistoryList() {
            const list = document.getElementById('chatHistory');
            list.innerHTML = '';
            const chats = Object.values(chatHistory).sort((a,b) => new Date(b.date) - new Date(a.date));
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<span style="flex:1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${chat.title}</span><span class="history-date">${formatDate(chat.date)}</span><button class="delete-btn" data-id="${chat.id}">⋮</button>`;
                div.onclick = (e) => { if (!e.target.classList.contains('delete-btn')) { loadChat(chat.id); closeSidebar(); } };
                div.querySelector('.delete-btn').onclick = (e) => { e.stopPropagation(); showDeleteConfirm(chat.id, e.target); };
                list.appendChild(div);
            });
        }

        function showDeleteConfirm(chatId, btn) {
            if (activeDeleteMenu) activeDeleteMenu.remove();
            const rect = btn.getBoundingClientRect();
            const div = document.createElement('div');
            div.className = 'delete-confirm';
            div.style.top = rect.bottom + 5 + 'px';
            div.style.left = Math.min(rect.left - 150, window.innerWidth - 210) + 'px';
            div.innerHTML = `<p>${texts[currentLanguage].deleteConfirm}</p><div class="delete-confirm-buttons"><button class="delete-confirm-btn delete-confirm-yes">${texts[currentLanguage].yes}</button><button class="delete-confirm-btn delete-confirm-no">${texts[currentLanguage].no}</button></div>`;
            document.body.appendChild(div);
            activeDeleteMenu = div;
            div.querySelector('.delete-confirm-yes').onclick = () => { deleteChat(chatId); div.remove(); activeDeleteMenu = null; };
            div.querySelector('.delete-confirm-no').onclick = () => { div.remove(); activeDeleteMenu = null; };
        }

        function deleteChat(id) {
            delete chatHistory[id];
            localStorage.setItem('neuroirk_history', JSON.stringify(chatHistory));
            if (id === currentChatId) newChat();
            else updateHistoryList();
        }

        function loadChat(id) {
            const chat = chatHistory[id];
            if (!chat) return;
            currentChatId = id;
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
            chat.messages.forEach(msg => { addMessage(msg.question, true); addMessage(msg.answer, false); });
        }

        function saveChat(question, answer) {
            if (!chatHistory[currentChatId]) {
                chatHistory[currentChatId] = { id: currentChatId, title: question.substring(0,30) + (question.length > 30 ? '...' : ''), date: new Date().toISOString(), messages: [] };
            } else {
                chatHistory[currentChatId].date = new Date().toISOString();
            }
            chatHistory[currentChatId].messages.push({ question, answer });
            updateHistoryList();
            localStorage.setItem('neuroirk_history', JSON.stringify(chatHistory));
        }

        function newChat() {
            currentChatId = Date.now().toString();
            document.getElementById('chatContainer').innerHTML = '';
            addMessage(texts[currentLanguage].welcome, false);
            closeSidebar();
        }

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<div class="message-avatar ${isUser ? 'user-avatar' : 'bot-avatar'}">${isUser ? '👤' : 'AI'}</div><div class="message-content"><div class="message-text">${text}</div></div>`;
            document.getElementById('chatContainer').appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const question = input.value.trim();
            const sendBtn = document.getElementById('sendBtn');
            if (!question || sendBtn.classList.contains('disabled')) return;
            sendBtn.classList.add('disabled');
            addMessage(question, true);
            input.value = '';
            input.style.height = 'auto';
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message';
            loadingDiv.innerHTML = `<div class="message-avatar bot-avatar">AI</div><div class="message-content"><div class="loading"><div class="loading-dots"><span></span><span></span><span></span></div></div></div>`;
            document.getElementById('chatContainer').appendChild(loadingDiv);
            loadingDiv.scrollIntoView({ behavior: 'smooth' });
            let answer = await getAnswer(question);
            loadingDiv.remove();
            addMessage(answer, false);
            saveChat(question, answer);
            sendBtn.classList.remove('disabled');
        }

        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('active'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('active'); }
        
        window.addEventListener('DOMContentLoaded', () => {
            updateHistoryList();
            const savedTheme = localStorage.getItem('neuroirk_theme') || 'light';
            const savedLang = localStorage.getItem('neuroirk_language') || 'ru';
            setTheme(savedTheme);
            setLanguage(savedLang);
            newChat();
            document.getElementById('openMenuBtn').onclick = openSidebar;
            document.getElementById('closeSidebarBtn').onclick = closeSidebar;
            document.getElementById('overlay').onclick = closeSidebar;
            document.getElementById('newChatBtnSidebar').onclick = newChat;
            document.getElementById('sendBtn').onclick = sendMessage;
            document.getElementById('userInput').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
            document.getElementById('userInput').oninput = function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; };
            document.querySelectorAll('.theme-btn').forEach(btn => { btn.onclick = () => setTheme(btn.dataset.theme); });
            document.querySelectorAll('.lang-btn').forEach(btn => { btn.onclick = () => setLanguage(btn.dataset.lang); });
        });
    </script>
</body>
</html>
